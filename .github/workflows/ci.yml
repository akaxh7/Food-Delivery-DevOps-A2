name: Food Delivery CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -f index.html
          test -f style.css
          echo "Website files verified successfully"

      - name: Build Food Delivery Docker image
        run: docker build -t food-delivery-app .

      - name: Validate ML monitoring Compose configuration
        run: docker compose -f q2-ml-monitoring/docker-compose.yml config

      - name: Build ML monitoring API image
        run: docker build -t ml-monitoring-api ./q2-ml-monitoring
